name: Prop Giveaway Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCOVERY_SCORE: "50"
          MIN_SCORE: "70"
          MAX_AGE_DAYS: "14"
        run: |
          python main.py

      - name: Save seen database
        run: |
          git config user.name "Prop Giveaway Hunter"
          git config user.email "actions@github.com"

          git add seen.json

          git diff --cached --quiet || \
            git commit -m "Update giveaway database"

          git push
